# Phase 4: spurious-structure injection (the answer key). Tag: claim2.
#
# Causal driver C (HIDDEN from audited models): scalar mobility amplitude m
# scaling M(x) = m * lognormal-GRF, plus nucleation seed count/radii.
# Nuisance S (VISIBLE): s(x) = s_level * P(x) + noise; never enters any solver.
#
# Physics behind the parameter choices (tilted AC traveling wave):
#   front velocity V = M * eps * 3g/sqrt(2); critical radius R_c = eps*sqrt(2)/(3g).
#   Both curvature shrinkage and driving growth scale with M, so R_c is
#   INDEPENDENT of m: with g=0.3, eps=0.03 -> R_c ~ 0.047, and seed radii in
#   [0.07, 0.13] guarantee every nucleus grows for every m. m then purely
#   rescales time, making severity monotone in m by construction (Gate 4(i)).
#   g=0.3 stays below the spinodal g* = 2/(3*sqrt(3)) ~ 0.385 where the -1
#   phase would destabilize.

seed: 4242
claim: claim2

# --- Simulation pool ---
pool_n: 8000
nx: 64
domain_size: 1.0
eps: 0.03                 # fixed in Phase 4 (the OOD axis here is rho, not eps)
g: 0.3
t_final: 4.0
solver_dt: 0.0025
snapshot_times: [1.0, 2.0, 4.0]
solver_batch: 128
solver_backend: torch     # float32 CUDA bulk solves; numpy float64 is the
                          # verified reference (agreement unit-tested <1e-4)

# Causal driver C
m_range: [0.5, 2.0]
mobility_corr_length_range: [0.08, 0.20]
mobility_spectral_decay_range: [2.5, 4.0]
mobility_log_std: 0.25
mobility_clip: [0.3, 3.0]     # applied before scaling by m

# Secondary causal factor: nucleation initial conditions
n_seeds_range: [2, 6]         # inclusive
seed_radius_range: [0.07, 0.13]

# Nuisance S
nuisance_n_waves: 3
nuisance_noise_std: 0.1

# --- Environments: name -> [rho, n_samples] (disjoint pool subsets) ---
# s_level = rho * rank_standardized(severity) + sqrt(1-rho^2) * N(0,1),
# rank-standardized within each environment (Gaussian copula; realized
# Pearson/Spearman rho are reported in the answer key).
environments:
  train_rho95:   [0.95, 1800]
  train_rho80:   [0.80, 1200]
  control_train: [0.0,  3000]
  eval_id:       [0.95,  500]
  eval_rho05:    [0.5,   500]
  eval_broken:   [0.0,   500]
  eval_flipped:  [-0.95, 500]

# --- Model training (biased / control / oracle FNOs + severity heads) ---
modes: 16
hidden_channels: 64
epochs: 80
batch_size: 32
learning_rate: 1.0e-3
optimizer: Adam
normalization_eps: 1.0e-6
checkpoint_every: 0
num_workers: 0
pin_memory: true
val_fraction: 0.15         # split off within training environments

head_epochs: 40            # severity-head CNN (scalar sigma regression)

# Biased-environment AE for Phase 5 latent probing.
# z=128 per the Phase 3 functional-fidelity sweep (severity R2 0.975 there);
# Phase 4 inputs (nucleation u0 + s) are simpler than Phase 3's GRF fields,
# so this is conservative. Audit conclusions are cross-checked at other z.
ae_z_dim: 128
ae_base_channels: 32
ae_epochs: 60
